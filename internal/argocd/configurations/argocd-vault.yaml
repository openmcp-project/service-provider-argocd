global:
  repository: {{ .Values.global.image.repository }}
  tag: {{ .Values.global.image.tag }}
  imagePullSecrets:
    - name: artifactory
repoServer:
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "vault-configuration"
  imagePullSecrets:
    - name: artifactory
  volumes:
    - name: cmp-plugin
      configMap:
        name: cmp-plugin
    - name: custom-tools
      emptyDir: {}
    - name: cmp-tmp
      emptyDir: {}
    - name: k8s-sa-project
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
  initContainers:
    - name: avp-binary
      command: [ sh, -c ]
      args:
        - >-
          cp /usr/local/bin/argocd-vault-plugin /custom-tools/ &&
          cp /usr/local/bin/avp-helm /custom-tools/
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
        - name: k8s-sa-project
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
  extraContainers:
    # argocd-vault-plugin with Helm
    - name: avp-helm
      command: [ /var/run/argocd/argocd-cmp-server ]
      image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
      envFrom:
        - secretRef:
            name: vault-configuration
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: argocd-cm-exec-timeout
              key: argocd.exec.timeout
              optional: true
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: cmp-tmp
        # Register plugins into sidecar
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: avp-helm.yaml
          name: cmp-plugin
        # Important: Mount tools into $PATH
        - name: custom-tools
          subPath: argocd-vault-plugin
          mountPath: /usr/local/bin/argocd-vault-plugin
        - name: custom-tools
          subPath: avp-helm
          mountPath: /usr/local/bin/avp-helm
        - name: k8s-sa-project
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
    - name: avp-helm-no-discover
      command: [ /var/run/argocd/argocd-cmp-server ]
      image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
      envFrom:
        - secretRef:
            name: vault-configuration
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: argocd-cm-exec-timeout
              key: argocd.exec.timeout
              optional: true
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: cmp-tmp
        # Register plugins into sidecar
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: argocd-vault-plugin-helm-no-discover.yaml
          name: cmp-plugin
        # Important: Mount tools into $PATH
        - name: custom-tools
          subPath: argocd-vault-plugin
          mountPath: /usr/local/bin/argocd-vault-plugin
        - name: custom-tools
          subPath: avp-helm
          mountPath: /usr/local/bin/avp-helm
        - name: k8s-sa-project
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
    # argocd-vault-plugin with Kustomize
    - name: avp-kustomize
      command: [ /var/run/argocd/argocd-cmp-server ]
      image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
      envFrom:
        - secretRef:
            name: vault-configuration
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: argocd-cm-exec-timeout
              key: argocd.exec.timeout
              optional: true
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: cmp-tmp
        # Register plugins into sidecar
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: avp-kustomize.yaml
          name: cmp-plugin
        # Important: Mount tools into $PATH
        - name: custom-tools
          subPath: argocd-vault-plugin
          mountPath: /usr/local/bin/argocd-vault-plugin
        - name: k8s-sa-project
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
    # argocd-vault-plugin with plain YAML
    - name: avp
      command: [ /var/run/argocd/argocd-cmp-server ]
      image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
      envFrom:
        - secretRef:
            name: vault-configuration
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: argocd-cm-exec-timeout
              key: argocd.exec.timeout
              optional: true
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: cmp-tmp
        # Register plugins into sidecar
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: avp.yaml
          name: cmp-plugin
        # Important: Mount tools into $PATH
        - name: custom-tools
          subPath: argocd-vault-plugin
          mountPath: /usr/local/bin/argocd-vault-plugin
        - name: k8s-sa-project
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true