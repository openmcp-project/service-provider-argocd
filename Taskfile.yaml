version: 3

vars:
  NESTED_MODULES: api
  API_DIRS: '{{.ROOT_DIR}}/api/v1alpha1/...'
  MANIFEST_OUT: '{{.ROOT_DIR}}/api/crds/manifests'
  CODE_DIRS: '{{.ROOT_DIR}}/cmd/... {{.ROOT_DIR}}/internal/... {{.ROOT_DIR}}/api/v1alpha1/...'
  COMPONENTS: 'service-provider-argocd'
  REPO_URL: 'https://github.com/openmcp-project/service-provider-argocd'
  CHART_COMPONENTS: "[]"
  CRDS_COMPONENTS: 'service-provider-argocd'
  CRDS_PATH: '{{.ROOT_DIR}}/api/crds/manifests'
  COMMON_SCRIPT_DIR: '{{.ROOT_DIR}}/hack/common'

includes:
  shared:
    taskfile: hack/common/Taskfile_controller.yaml
    flatten: true

tasks:
  build:img:build-test:
    desc: "Build image for current platform and tag without suffix for testing"
    cmds:
      - task: build:img:build
      - docker tag ghcr.io/openmcp-project/images/{{.COMPONENTS}}:{{.VERSION}}-linux-{{ARCH}} ghcr.io/openmcp-project/images/{{.COMPONENTS}}:{{.VERSION}}
    vars:
      VERSION:
        sh: $COMMON_SCRIPT_DIR/get-version.sh
      ARCH:
        sh: uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/'

  test-e2e:
    desc: "Build image and run e2e tests"
    vars:
      # Go's test binary enforces a default 10m timeout (panicking with "test
      # timed out") regardless of any -timeout set via `go test`'s caller.
      # The e2e suite bootstraps a kind cluster, the openmcp-operator, Flux,
      # and pulls real OCI Helm charts over the network, which can comfortably
      # exceed that. Override on the CLI if you need even more headroom, e.g.:
      #   task test-e2e E2E_TIMEOUT=60m
      E2E_TIMEOUT: '{{.E2E_TIMEOUT | default "45m"}}'
    cmds:
      - task: build:img:build-test
      - go test -v ./test/e2e/... -count=1 -timeout {{.E2E_TIMEOUT}}
